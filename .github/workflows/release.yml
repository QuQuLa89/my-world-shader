name: Release Shaderpack

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package release zip
        run: |
          zip -r "my-world-shader-${{ github.ref_name }}.zip" shaders/ README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "my-world-shader-${{ github.ref_name }}.zip"
          generate_release_notes: true
